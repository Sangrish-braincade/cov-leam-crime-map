# Every 20 minutes: find new local crime articles (publisher sitemaps + BBC RSS),
# fetch each page politely, extract street / area / category with string matching
# (no AI), and commit data/news-archive/. [skip-cd] stops Amplify rebuilding;
# the site's /api/news route reads the committed files from GitHub instead.
name: news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # CoventryLive asks for 10 s between requests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/news/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: jobs/news
      - name: Scrape new articles
        run: node jobs/news/scrape.mjs
      - name: Link stories to police.uk records
        run: node scripts/correlate.mjs
      - name: Commit
        run: |
          git config user.name "crime-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news-archive
          git diff --cached --quiet && exit 0
          git commit -m "news: new articles [skip-cd]"
          git pull --rebase
          git push
