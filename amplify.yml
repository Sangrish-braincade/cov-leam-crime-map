version: 1
env:
  variables:
    NEXT_SKIP_SWC_BINARY_CACHE: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify console env vars only reach the Next.js server runtime if they
        # are written to .env.production at build time. Allowlist, not a dump.
        - 'env | grep -E "^NEWS_BASE_URL=" >> .env.production || true'
        # prebuild runs scripts/pack.mjs: data/crimes/*.json -> public/data/
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
